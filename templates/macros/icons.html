{% macro icon(name, size=20, cls='') -%}
<svg class="icon {{ cls }}" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24"
     fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
     stroke-linejoin="round" aria-hidden="true" focusable="false">
  {%- if name == 'folder' -%}
  <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
  {%- elif name == 'file' -%}
  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
  <path d="M14 2v6h6"/><path d="M8 13h8"/><path d="M8 17h6"/>
  {%- elif name == 'plus' -%}
  <path d="M12 5v14"/><path d="M5 12h14"/>
  {%- elif name == 'search' -%}
  <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
  {%- elif name == 'sun' -%}
  <circle cx="12" cy="12" r="4"/>
  <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
  {%- elif name == 'moon' -%}
  <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
  {%- elif name == 'monitor' -%}
  <rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>
  {%- elif name == 'arrow-left' -%}
  <path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>
  {%- elif name == 'trash' -%}
  <path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/>
  <path d="M10 11v5M14 11v5"/>
  {%- elif name == 'check' -%}
  <path d="M20 6 9 17l-5-5"/>
  {%- elif name == 'bell' -%}
  <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/>
  {%- elif name == 'more' -%}
  <circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>
  {%- elif name == 'x' -%}
  <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
  {%- elif name == 'chevron-right' -%}
  <path d="m9 18 6-6-6-6"/>
  {%- elif name == 'chevrons-up' -%}
  <path d="m7 20 5-5 5 5"/><path d="m7 4 5 5 5-5"/>
  {%- elif name == 'settings' -%}
  <circle cx="12" cy="12" r="3"/>
  <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.65 1.65 0 0 0 15 19.4a1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.5.53.87 1.02.99H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>

  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>
  {%- elif name == 'menu' -%}
  <path d="M4 6h16M4 12h16M4 18h16"/>
  {%- elif name == 'clock' -%}
  <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
  {%- elif name == 'calendar' -%}
  <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/>
  {%- elif name == 'inbox' -%}
  <path d="M4 4h16v16H4z"/><path d="M4 13h5l2 3h2l2-3h5"/>
  {%- elif name == 'list' -%}
  <path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/>
  {%- elif name == 'list-ordered' -%}
  <path d="M10 6h11M10 12h11M10 18h11"/><path d="M4 5h1v4M4 9h2M4 14h2l-2 3h2M4 19h2"/>
  {%- elif name == 'quote' -%}
  <path d="M7 7H4v4h3l-1 3M14 7h-3v4h3l-1 3"/>
  {%- elif name == 'code' -%}
  <path d="m8 9-3 3 3 3M16 9l3 3-3 3M14 5l-4 14"/>
  {%- elif name == 'terminal' -%}
  <path d="m4 17 6-6-6-6"/><path d="M12 19h8"/>
  {%- elif name == 'link' -%}
  <path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/>
  <path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>
  {%- elif name == 'table' -%}
  <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16M15 4v16"/>
  {%- elif name == 'check-square' -%}
  <rect x="3" y="3" width="8" height="8" rx="1"/><path d="m5 7 1.5 1.5L9.5 5"/>
  <path d="M14 6h7M14 12h7M14 18h7"/>
  {%- elif name == 'minus' -%}
  <path d="M4 12h16"/>
  {%- elif name == 'pencil' -%}
  <path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>
  {%- endif -%}
</svg>
{%- endmacro %}
